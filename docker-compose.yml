version: '3.9'

services:
   jenkins:
    image: matiasroje/jenkins-docker:1.0
    ports:
      - "8081:8080" # Change host port to avoid conflict with nginx
    volumes:
      - new_jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket
    privileged: true

volumes:
  new_jenkins: